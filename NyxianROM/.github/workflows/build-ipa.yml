# 独立版：不需要 fork Nyxian，也不需要把 NyxianROM 塞进上游仓库
#
# 用法：
#   1. 新建一个空 GitHub 仓库（public），把 NyxianROM/ 整个目录上传进去
#   2. 把本文件放到 .github/workflows/build-ipa.yml
#   3. Actions -> build-ipa -> Run workflow
#
# 它自己会把 emexlab/Nyxian clone 下来、钉到你指定的 commit、拉好 submodule，
# 再调 NyxianROM/build.sh 编 App + ROM + 烤 ipa。
#
# runner 用 xcode-27（macOS 27 基座，Xcode 27.1 + iOS 27.x SDK），
# 公开仓库的标准 macOS runner 不计费，单 job 上限 6 小时。

name: build-ipa

on:
  workflow_dispatch:
    inputs:
      nyxian_ref:
        description: "要编的 Nyxian commit / tag"
        required: false
        default: "0d573db99dca"
  push:
    branches: [main]
    paths:
      - "NyxianROM/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NYXIAN_REPO: https://github.com/emexlab/Nyxian.git
  NYXIAN_REF: ${{ inputs.nyxian_ref || '0d573db99dca' }}

jobs:
  llvm:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Clone Nyxian
        run: |
          set -eux
          git clone --filter=blob:none "$NYXIAN_REPO" nyxian
          cd nyxian
          git checkout "$NYXIAN_REF"
          git submodule update --init --recursive

      - name: Submodule revision
        id: sub
        run: echo "sha=$(git -C nyxian/LLVM-On-iOS rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: llvm-${{ steps.sub.outputs.sha }}

      - name: Build LLVM-on-iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          brew install cmake ninja pkgconf || true
          make -C nyxian/LLVM-On-iOS -j"$(sysctl -n hw.ncpu)"
          rm -rf nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
          mkdir -p nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
          cp -R nyxian/LLVM-On-iOS/CoreCompilerSupportLibs/. nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs/
          cp -R nyxian/LLVM-On-iOS/LLVM.xcframework nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs/LLVM.xcframework
          du -sh nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs

  app:
    needs: llvm
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Clone Nyxian
        run: |
          set -eux
          git clone --filter=blob:none "$NYXIAN_REPO" nyxian
          cd nyxian
          git checkout "$NYXIAN_REF"
          git submodule update --init --recursive

      - name: Submodule revision
        id: sub
        run: echo "sha=$(git -C nyxian/LLVM-On-iOS rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: llvm-${{ steps.sub.outputs.sha }}

      - name: Make sure LLVM cache is present
        run: |
          test -d nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs || {
            echo "LLVM 缓存没命中，请在同一个 run 里先跑 llvm job（或重跑一次）" >&2
            exit 1
          }

      - name: Install build deps
        run: |
          brew update --quiet || true
          brew install pkgconf cmake libarchive dpkg openssl ninja || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build Nyxian.ipa
        run: make -C nyxian CHECK_DEPS=0

      - name: Build ROM + bake ipa
        run: |
          chmod +x NyxianROM/build.sh NyxianROM/tools/fetch_kexts.sh
          ./NyxianROM/build.sh "$PWD/nyxian" --ipa

      - name: Collect
        run: |
          mkdir -p out
          cp nyxian/Nyxian.ipa out/ 2>/dev/null || true
          cp NyxianROM/rom.zip out/ 2>/dev/null || true
          cp NyxianROM/Nyxian-baked.ipa out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: nyxian-ipa-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
