# Codemagic build for nyxian-rom-builder
#
# Produces three artifacts:
#   nyxian/Nyxian.ipa        stock UI, needs a ROM flash
#   NyxianROM/rom.zip        ROM slot package
#   NyxianROM/Nyxian-baked.ipa  stock slot replaced by this ROM, boots straight into it
#
# Flow: clone emexlab/Nyxian at NYXIAN_REF, build LLVM-on-iOS (cached),
# build the app, then run NyxianROM/build.sh --ipa.

workflows:
  nyxian-rom:
    name: Nyxian + NyxianROM
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        NYXIAN_REPO: https://github.com/emexlab/Nyxian.git
        NYXIAN_REF: "0d573db99dca"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
    scripts:
      - name: Clone Nyxian
        script: |
          set -e
          git clone --filter=blob:none "$NYXIAN_REPO" nyxian
          cd nyxian
          git checkout "$NYXIAN_REF"
          git submodule update --init --recursive
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Narrow LLVM backends
        script: |
          set -e
          # LLVM defaults to building every backend (RISCV, PowerPC, Mips...).
          # iOS only needs AArch64; X86 is kept as a safety margin for host tools.
          python3 - <<'PY'
          import sys
          path = "nyxian/LLVM-On-iOS/Scripts/swift-ios-toolchain-presets.ini"
          text = open(path).read()
          if "LLVM_TARGETS_TO_BUILD" not in text:
              anchor = "    -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-darwin\n"
              if anchor not in text:
                  raise SystemExit("anchor not found in preset file")
              text = text.replace(
                  anchor,
                  anchor + "    -DLLVM_TARGETS_TO_BUILD:STRING=AArch64;X86\n")
              open(path, "w").write(text)
              print("patched LLVM_TARGETS_TO_BUILD=AArch64;X86")
          else:
              print("preset already sets LLVM_TARGETS_TO_BUILD")
          PY
          grep -n "LLVM_TARGETS_TO_BUILD" nyxian/LLVM-On-iOS/Scripts/swift-ios-toolchain-presets.ini || true

      - name: Build LLVM-on-iOS (cached)
        script: |
          set -e
          if [ ! -d nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs ]; then
            brew install cmake ninja pkgconf || true
            make -C nyxian/LLVM-On-iOS -j"$(sysctl -n hw.ncpu)"
            rm -rf nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
            mkdir -p nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs
            cp -R nyxian/LLVM-On-iOS/CoreCompilerSupportLibs/. nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs/
            cp -R nyxian/LLVM-On-iOS/LLVM.xcframework nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs/LLVM.xcframework
          else
            echo "LLVM cache hit"
          fi
          du -sh nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs || true

      - name: Install Metal toolchain
        script: |
          set -e
          # Xcode 26+ ships the Metal compiler as a separate downloadable component.
          # Without it every CompileMetalFile step fails (SwiftTerm's Shaders.metal).
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version || true

      - name: Build Nyxian.ipa
        script: |
          set -e
          brew install pkgconf cmake libarchive dpkg openssl ninja || true
          make -C nyxian CHECK_DEPS=0

      - name: Build ROM and bake ipa
        script: |
          set -e
          chmod +x NyxianROM/build.sh NyxianROM/tools/fetch_kexts.sh
          ./NyxianROM/build.sh "$CM_BUILD_DIR/nyxian" --ipa
          ls -lh NyxianROM/rom.zip NyxianROM/Nyxian-baked.ipa

    artifacts:
      - nyxian/Nyxian.ipa
      - NyxianROM/rom.zip
      - NyxianROM/Nyxian-baked.ipa
