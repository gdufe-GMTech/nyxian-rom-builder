# Builds Nyxian.ipa plus the NyxianROM package, reusing a toolchain artifact
# produced by the "toolchain" workflow. Around 10 minutes per run.
#
# Why the split: the toolchain takes 3-4 hours and rarely changes, while the
# app/ROM side iterates in minutes. Pass the run id of a successful "toolchain"
# run (its artifact is kept for 30 days).

name: build-ipa

on:
  workflow_dispatch:
    inputs:
      nyxian_ref:
        description: "Nyxian commit / tag to build"
        required: false
        default: "0d573db99dca"
      toolchain_run_id:
        description: "Run id of the workflow run that produced the toolchain artifact"
        required: false
        default: "41865439465"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  NYXIAN_REPO: https://github.com/emexlab/Nyxian.git
  NYXIAN_REF: ${{ inputs.nyxian_ref || '0d573db99dca' }}
  TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id || '41865439465' }}

jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Clone Nyxian
        run: |
          set -eux
          git clone --filter=blob:none "$NYXIAN_REPO" nyxian
          cd nyxian
          git checkout "$NYXIAN_REF"
          git submodule update --init --recursive

      - name: Download toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: .
          run-id: ${{ env.TOOLCHAIN_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack toolchain
        run: |
          set -eux
          mkdir -p nyxian/Frameworks/CoreCompiler
          tar -xzf toolchain.tgz -C nyxian/Frameworks/CoreCompiler
          test -d nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs/LLVM.xcframework
          du -sh nyxian/Frameworks/CoreCompiler/CoreCompilerSupportLibs

      - name: Install Metal toolchain
        run: |
          set -eux
          # Xcode 26+ ships the Metal compiler as a separate component;
          # without it every CompileMetalFile step fails (SwiftTerm's Shaders.metal).
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version || true

      - name: Build deps
        run: |
          brew update --quiet || true
          brew install pkgconf cmake libarchive dpkg openssl ninja || true
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build Nyxian.ipa
        run: make -C nyxian CHECK_DEPS=0

      # Upload the app before the ROM step: the ROM generator can fail on its own
      # (nxromgen patches upstream sources) and we still want the ipa.
      - uses: actions/upload-artifact@v4
        with:
          name: nyxian-ipa-${{ github.run_number }}
          path: nyxian/Nyxian.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Build ROM and bake ipa
        id: rom
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x NyxianROM/build.sh NyxianROM/tools/fetch_kexts.sh
          ./NyxianROM/build.sh "$PWD/nyxian" --ipa 2>&1 | tee rom-build.log

      - name: Collect ROM
        if: always()
        run: |
          mkdir -p out
          cp NyxianROM/rom.zip out/ 2>/dev/null || true
          cp NyxianROM/Nyxian-baked.ipa out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyxian-rom-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: warn

      # Keeps the ROM build output available even when the step above failed,
      # so a failure can be diagnosed without downloading the whole job log.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-log-${{ github.run_number }}
          path: rom-build.log
          retention-days: 7
          if-no-files-found: warn
